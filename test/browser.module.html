<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title></title>
</head>
<body>
	<script type="module">
            import { Pane } from '/public/_assets/js/tweakpane.3.1.9.js';
    import * as IvanliCnTweakpaneMultipleSelectPlugin from '/tweakpane-multiple-select-plugin/dist/ivanli-cn-tweakpane-multiple-select-plugin.umd.js';

		const params = {
			prop: ['c'],
			empty: [],
		};
		const pane = new Pane();

		// Register plugin
		pane.registerPlugin(IvanliCnTweakpaneMultipleSelectPlugin);

		// TODO: Update parameters for your plugin
		pane.addBlade(params, 'prop', {
			view: 'multiple-select',
			options: {
				"A": "a",
				"B": "b",
				"C": "c",
				"D": "d",
			},
		}).on('change', (ev) => {
			console.log(ev.value);
		});
		pane.addInput(params, 'empty', {
			view: 'multiple-select',
			options: {
			},
		}).on('change', (ev) => {
			console.log(ev.value);
		});

		window.pane = pane;
	</script>
</body>
</html>
